[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobapply"
version = "0.1.0"
description = "Local-first TUI for evidence-based AI-tailored job applications"
requires-python = ">=3.10"

[project.scripts]
jobapply = "jobapply.cli:main"

[tool.setuptools.packages.find]
include = ["jobapply*"]
